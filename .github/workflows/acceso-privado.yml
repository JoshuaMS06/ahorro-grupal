name: Validar acceso privado por salones
on:
  push:
    branches:
      - feature/acceso-privado-salones
  pull_request:
    branches:
      - main
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Validar reglas en emulador Firebase
        run: npx --yes firebase-tools emulators:exec --project demo-ahorro-grupal --only database "node --test tests-emulator/roles.rules.test.mjs"
